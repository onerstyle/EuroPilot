# Déploiement automatique d'EuroPilot sur GitHub Pages
# Se déclenche à chaque push sur la branche principale.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Configuration de Pages
        uses: actions/configure-pages@v5
      - name: Téléversement du site (statique, aucun build nécessaire)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
