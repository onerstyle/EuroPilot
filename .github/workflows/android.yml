# Construit l'APK Android de debug d'EuroPilot (Capacitor) à chaque évolution
# du code web ou du projet natif, et publie l'APK en artifact téléchargeable.
name: Build Android (APK)

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'index.html'
      - 'app.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'www/**'
      - 'index.html'
      - 'app.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances npm
        run: npm ci

      - name: Génération du dossier web (www/)
        run: npm run sync:www

      - name: Synchronisation Capacitor (web → android)
        run: npx cap sync android

      - name: Installation du JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installation du SDK Android
        uses: android-actions/setup-android@v3

      - name: Construction de l'APK debug
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Téléversement de l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: europilot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------
      # Publication d'un AAB (Android App Bundle) pour le Play Store :
      # nécessite une signature (keystore) — décommenter une fois configurée.
